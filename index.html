<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출하 QR 중량 검수</title>
  <meta property="og:title" content="출하 QR 중량 검수" />
  <meta property="og:description" content="출하 품목 QR 중량 및 LOT 검수 화면" />
  <meta property="og:image" content="https://jis871004-bot.github.io/logo.png" />
  <meta property="og:type" content="website" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 14px; background: #f4f6f8; overflow-x: hidden; }
    .header-box {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 10px; margin: 4px auto 10px;
    }
    .logo-img {
      height: 36px; width: auto; object-fit: contain;
      background: #fff; padding: 3px 6px; border-radius: 8px;
      border: 1px solid #d1d5db;
    }
    h2 { margin: 0; font-size: 20px; }
    .stats { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; font-size: 15px; font-weight: bold; }
    .stat-box { background: #fff; padding: 6px 12px; border-radius: 8px; border: 1px solid #d1d5db; }
    #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; }
    #result {
      margin: 12px auto 0; max-width: 420px; padding: 18px 14px;
      border-radius: 14px; font-size: 20px; font-weight: bold;
      background: #fff; border: 3px solid #ccc; line-height: 1.4;
    }
    .ok { background: #e6f9ed !important; border-color: #16a34a !important; color: #15803d !important; }
    .ng { background: #fee2e2 !important; border-color: #dc2626 !important; color: #b91c1c !important; }
    .sub { display: block; font-size: 14px; font-weight: normal; margin-top: 6px; color: #222; }
    .btns { display: flex; justify-content: center; gap: 8px; max-width: 420px; margin: 10px auto 0; }
    button { padding: 10px 16px; font-size: 15px; border: none; border-radius: 10px; background: #374151; color: #fff; font-weight: bold; cursor: pointer; }

    /* 하단 검수 로그 리스트 */
    .log-wrap {
      max-width: 420px; margin: 14px auto 0; text-align: left;
      background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 10px 12px;
    }
    .log-title { font-size: 14px; font-weight: bold; color: #374151; margin-bottom: 8px; }
    .log-list { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; font-size: 13px; }
    .log-item { padding: 8px 6px; border-bottom: 1px solid #eef0f2; line-height: 1.4; }
    .log-item:last-child { border-bottom: none; }
    .log-head { margin-bottom: 3px; }
    .log-ok { color: #15803d; font-weight: bold; }
    .log-ng { color: #b91c1c; font-weight: bold; }
    .log-dup { color: #b45309; font-weight: bold; }
    .log-line { color: #374151; display: block; font-size: 12.5px; }

    /* 화면 전체 번쩍임 & 큰 O / X 오버레이 */
    #flashOverlay {
      position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 9998;
      transition: opacity 0.08s ease-out;
    }
    #flashOverlay.flash-ok { background: rgba(34, 197, 94, 0.55); opacity: 1; }
    #flashOverlay.flash-ng { background: rgba(239, 68, 68, 0.72); opacity: 1; }
    #flashOverlay.flash-shutter { background: rgba(255, 255, 255, 0.75); opacity: 1; }

    #oxBadge {
      position: fixed; top: 32%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none; opacity: 0; z-index: 9999;
      font-size: 120px; font-weight: 900; line-height: 1;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.14s ease-out, opacity 0.14s ease-out;
    }
    #oxBadge.show { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    #oxBadge.ox-ok { color: #16a34a; }
    #oxBadge.ox-ng { color: #dc2626; }
  </style>
</head>
<body>
  <div id="flashOverlay"></div>
  <div id="oxBadge"></div>

  <div class="header-box">
    <img src="./logo.png" alt="JS Tech Co.,Ltd." class="logo-img">
    <h2>출하 QR 연속 검수</h2>
  </div>
  <div class="stats">
    <div class="stat-box">총 스캔: <span id="cntTotal">0</span></div>
    <div class="stat-box" style="color:#15803d;">정상: <span id="cntOk">0</span></div>
    <div class="stat-box" style="color:#b91c1c;">불일치: <span id="cntNg">0</span></div>
  </div>
  <div id="reader"></div>
  <div id="result">후면 카메라로 QR 코드를 비춰주세요</div>
  <div class="btns">
    <button onclick="resetCounts()">카운트 및 로그 초기화</button>
  </div>

  <div class="log-wrap">
    <div class="log-title">검수 이력 (최신순 · 화면 캡처용)</div>
    <ul id="logList" class="log-list">
      <li class="log-item" style="color:#6b7280;">스캔 내역이 여기에 쌓입니다.</li>
    </ul>
  </div>

 <script>
    const PRODUCT_RULES = {
      "MLHA0113": { name: "MLHA0113", weight: 300 },
      "MLHA1114": { name: "MLHA1114", weight: 200 },
      "MLHB0113B": { name: "MLHB0113B", weight: 300 },
      "MLHB1114": { name: "MLHB1114", weight: 200 },
      "MLHC0117": { name: "MLHC0117", weight: 300 },
      "MLHC1114": { name: "MLHC1114", weight: 200 },
      "MLHD0117": { name: "MLHD0117", weight: 300 },
      "MLHD1114": { name: "MLHD1114", weight: 200 },
      "MLHE1114": { name: "MLHE1114", weight: 200 },
      "MLHF1114": { name: "MLHF1114", weight: 200 },
      "MLHR0113": { name: "MLHR0113", weight: 300 }
    };

    const P_LOT_INDEX = 4;

    let totalCnt = 0, okCnt = 0, ngCnt = 0;
    let lastText = "";
    let lastTime = 0;
    let audioCtx = null;
    let hasLogged = false;
    let isStartingCam = false;
    let html5QrCode = null;
    const seenCodes = new Set();

    function showErrorBox(title, detail) {
      const resBox = document.getElementById("result");
      if (resBox) {
        resBox.className = "ng";
        resBox.innerHTML = `<span class="c-red">${title}</span><span class="sub">${detail}</span>`;
      }
    }

    window.addEventListener("error", (e) => {
      showErrorBox("⚠️ 스크립트 오류", e.message || String(e));
    });

    function getHydrateType(code) {
      const m = (code || "").trim().match(/^[A-Za-z]+(\d)/);
      if (!m) return "";
      if (m[1] === "0") return "일수";
      if (m[1] === "1") return "무수";
      return "";
    }

    function buildHydrateHtml(code) {
      const h = getHydrateType(code);
      if (!h) return "";
      const cls = h === "일수" ? "c-ils" : "c-musu";
      return `<span class="c-blue"> / </span><span class="${cls}">${h}</span>`;
    }

    function formatTimeNow() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function appendLog(topHtml, bottomLineText, rawText) {
      const list = document.getElementById("logList");
      if (!hasLogged) {
        list.innerHTML = "";
        hasLogged = true;
      }
      const isDup = seenCodes.has(rawText);
      seenCodes.add(rawText);

      const li = document.createElement("li");
      li.className = "log-item";
      const dupHtml = isDup ? ` <span class="log-dup c-red">[중복]</span>` : "";

      li.innerHTML = `
        <div class="log-head"><span class="c-blue">#${totalCnt}</span> ${topHtml}${dupHtml}</div>
        <span class="log-line">${formatTimeNow()} · ${bottomLineText}</span>
      `;
      list.prepend(li);
    }

    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    document.addEventListener("touchstart", () => getAudioCtx(), { once: true, passive: true });

    function playSound(isOk) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (isOk) {
          [880, 1174.66].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.25, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.11);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.12);
          });
        } else {
          [320, 220].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(freq, now + idx * 0.16);
            gain.gain.setValueAtTime(0.3, now + idx * 0.16);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.16);
            osc.stop(now + idx * 0.16 + 0.16);
          });
        }
      } catch (e) {}
    }

    function triggerAction(isOk) {
      const flash = document.getElementById("flashOverlay");
      const badge = document.getElementById("oxBadge");

      flash.className = "flash-shutter";
      setTimeout(() => {
        flash.className = isOk ? "flash-ok" : "flash-ng";
      }, 65);
      setTimeout(() => {
        flash.className = "";
      }, 360);

      badge.textContent = isOk ? "O" : "X";
      badge.className = (isOk ? "ox-ok" : "ox-ng") + " show";
      setTimeout(() => {
        badge.className = "";
      }, 650);

      playSound(isOk);
      if (navigator.vibrate) {
        try {
          navigator.vibrate(isOk ? [70] : [180, 80, 180]);
        } catch (e) {}
      }
    }

    function updateStats(isOk) {
      totalCnt += 1;
      if (isOk) okCnt += 1; else ngCnt += 1;
      document.getElementById("cntTotal").textContent = totalCnt;
      document.getElementById("cntOk").textContent = okCnt;
      document.getElementById("cntNg").textContent = ngCnt;
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastText && now - lastTime < 1500) return;
      lastText = decodedText;
      lastTime = now;

      const trimmed = decodedText.trim();
      const parts = trimmed.split("#");
      const resBox = document.getElementById("result");

      if (parts.length < 4) {
        updateStats(false);
        triggerAction(false);
        resBox.className = "ng";
        const errTopHtml = `<span class="c-red">🚨 형식 오류</span>`;
        resBox.innerHTML = `${errTopHtml}<span class='sub'>${decodedText}</span>`;
        appendLog(errTopHtml, trimmed, trimmed);
        return;
      }

      const lot = (parts[1] || "").trim();
      const qrWeight = parseFloat(parts[2]);
      const code = (parts[3] || "").trim();
      const pLot = (parts[P_LOT_INDEX] || "").trim();
      const pLotLabel = pLot || "-";
      const hydrateHtml = buildHydrateHtml(code);
      const rule = PRODUCT_RULES[code];

      if (!rule) {
        updateStats(false);
        triggerAction(false);
        resBox.className = "ng";
        const unregTopHtml = `<span class="c-red">⚠️ 미등록</span> <span class="c-blue">${pLotLabel} / ${qrWeight}kg</span>${hydrateHtml}`;
        resBox.innerHTML = `${unregTopHtml}<span class='sub'>LOT : ${lot} / ${code}</span>`;
        appendLog(unregTopHtml, `LOT : ${lot} / ${code}`, trimmed);
        return;
      }

      if (Math.abs(qrWeight - rule.weight) < 0.001) {
        updateStats(true);
        triggerAction(true);
        resBox.className = "ok";
        const okTopHtml = `<span class="c-blue">✅ 정상 ${pLotLabel} / ${rule.weight}kg</span>${hydrateHtml}`;
        resBox.innerHTML = `${okTopHtml}<span class='sub'>LOT : ${lot} / ${rule.name}</span>`;
        appendLog(okTopHtml, `LOT : ${lot} / ${rule.name}`, trimmed);
      } else {
        updateStats(false);
        triggerAction(false);
        resBox.className = "ng";
        const ngTopHtml = `<span class="c-red">🚨 불일치</span> <span class="c-blue">${pLotLabel} / QR ${qrWeight}kg (기준 ${rule.weight}kg)</span>${hydrateHtml}`;
        resBox.innerHTML = `${ngTopHtml}<span class='sub'>LOT : ${lot} / ${rule.name}</span>`;
        appendLog(ngTopHtml, `LOT : ${lot} / ${rule.name}`, trimmed);
      }
    }

    function resetCounts() {
      totalCnt = 0; okCnt = 0; ngCnt = 0; lastText = ""; hasLogged = false;
      seenCodes.clear();
      document.getElementById("cntTotal").textContent = 0;
      document.getElementById("cntOk").textContent = 0;
      document.getElementById("cntNg").textContent = 0;
      document.getElementById("logList").innerHTML = '<li class="log-item" style="color:#111827;">스캔 내역이 여기에 쌓입니다.</li>';
      const resBox = document.getElementById("result");
      resBox.className = "";
      resBox.innerHTML = "후면 카메라로 QR 코드를 비춰주세요";
    }

    async function startCamera() {
      if (isStartingCam) return;
      isStartingCam = true;

      try {
        if (typeof Html5Qrcode === "undefined") {
          showErrorBox("⚠️ 라이브러리 로드 실패", "html5-qrcode 스크립트를 불러오지 못했습니다. 네트워크를 확인하세요.");
          return;
        }
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        try {
          if (html5QrCode.isScanning) {
            await html5QrCode.stop();
          }
        } catch (stopErr) {}

        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 240, height: 240 } },
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        showErrorBox("⚠️ 카메라 시작 실패", String(err));
      } finally {
        isStartingCam = false;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      startCamera();
    });
  </script>
